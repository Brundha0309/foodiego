# ===== FoodieGo Backend Configuration =====
spring.application.name=foodiego-backend
server.port=8080

# ---- MySQL Database (default - update credentials as needed) ----
spring.datasource.url=jdbc:mysql://localhost:3306/foodiego_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Brundha@0309
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true

# Run database/seed-data.sql once schema is created (change to 'always' on first run, then 'never')
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# ---- CORS handled in WebConfig.java ----

# ---- File upload (for future use) ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
