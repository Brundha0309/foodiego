<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offers & Coupons | FoodieGo</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="brand"><span class="logo-icon">🍴</span>Foodie<span class="go">Go</span></a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="menu.html">Menu</a>
    <a href="offers.html" class="active">Offers</a>
    <a href="track-order.html">Track Order</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </div>
  <div class="nav-actions">
    <a href="cart.html" class="icon-btn" title="Cart">🛒<span class="cart-badge">0</span></a>
    <a href="login.html" id="nav-account-link" class="icon-btn" title="Account">👤</a>
  </div>
</nav>

<div class="section container">
  <h2>Offers & Coupons</h2>
  <div class="offers-grid" id="offersGrid"></div>
</div>

<footer>
  <p>Foodie<span>Go</span> ❤ Fast &bull; Fresh &bull; Reliable</p>
</footer>

<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
async function loadOffers() {
  const grid = document.getElementById("offersGrid");
  try {
    const coupons = await Api.getCoupons();
    grid.innerHTML = coupons.map(c => `
      <div class="offer-card ${c.badgeColor || 'red'}">
        <div>
          <h3>${c.title}</h3>
          <p>${c.description}</p>
        </div>
        <span class="code-btn" onclick="copyCode('${c.code}')">Use Code: ${c.code}</span>
      </div>`).join("");
  } catch (e) {
    grid.innerHTML = `<p style="color:var(--muted)">Could not load offers. (${e.message})</p>`;
  }
}
function copyCode(code) {
  navigator.clipboard.writeText(code).then(() => showToast(`Copied "${code}" to clipboard`));
}
loadOffers();
</script>
</body>
</html>
