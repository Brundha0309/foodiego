<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | FoodieGo</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="brand"><span class="logo-icon">🍴</span>Foodie<span class="go">Go</span></a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="menu.html">Menu</a>
    <a href="offers.html">Offers</a>
    <a href="track-order.html">Track Order</a>
    <a href="about.html">About</a>
    <a href="contact.html" class="active">Contact</a>
  </div>
  <div class="nav-actions">
    <a href="cart.html" class="icon-btn" title="Cart">🛒<span class="cart-badge">0</span></a>
    <a href="login.html" id="nav-account-link" class="icon-btn" title="Account">👤</a>
  </div>
</nav>

<div class="contact-layout">
  <div class="contact-info-card">
    <h2 style="margin-bottom:20px;">Get in Touch</h2>
    <p style="color:var(--muted);margin-bottom:22px;">We're here to help! Feel free to reach out to us.</p>
    <div class="contact-info-row"><div class="ic">✉</div><div><strong>Email</strong><br><span style="color:var(--muted);">support@foodiego.com</span></div></div>
    <div class="contact-info-row"><div class="ic">📞</div><div><strong>Phone</strong><br><span style="color:var(--muted);">+91 98765 43210</span></div></div>
    <div class="contact-info-row"><div class="ic">📍</div><div><strong>Address</strong><br><span style="color:var(--muted);">123, Foodie Street, Karur, Tamil Nadu - 639002</span></div></div>
  </div>

  <div class="contact-form-card">
    <form id="contactForm">
      <div class="field"><label>Name</label><input type="text" id="cName" required></div>
      <div class="field"><label>Email</label><input type="email" id="cEmail" required></div>
      <div class="field"><label>Message</label><textarea id="cMessage" rows="6" required style="width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:10px;outline:none;font-size:14px;"></textarea></div>
      <button type="submit" class="btn btn-dark btn-block">Send Message</button>
    </form>
  </div>
</div>

<footer>
  <p>Foodie<span>Go</span> ❤ Fast &bull; Fresh &bull; Reliable</p>
</footer>

<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
document.getElementById("contactForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector("button");
  btn.textContent = "Sending..."; btn.disabled = true;
  try {
    await Api.sendContact({
      name: document.getElementById("cName").value,
      email: document.getElementById("cEmail").value,
      message: document.getElementById("cMessage").value
    });
    showToast("Message sent! We'll get back to you soon.");
    e.target.reset();
  } catch (err) {
    showToast(err.message);
  } finally {
    btn.textContent = "Send Message"; btn.disabled = false;
  }
});
</script>
</body>
</html>
